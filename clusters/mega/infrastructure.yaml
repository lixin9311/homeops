# Cluster-level infrastructure, reconciled from ./infrastructure/controllers.
# Resources that need the controllers' CRDs first, such as cert-manager
# ClusterIssuers, live in the `infra-configs` Kustomization below.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers
  prune: true
  wait: true
---
# GitHub Actions runner scale set. Separate from the controllers because it needs
# the ARC CRDs first (dependsOn) and carries a SOPS-encrypted GitHub token.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arc-runners
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: infra-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/arc-runners
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# Cloudflare Tunnel connector. Own Kustomization because it carries a
# SOPS-encrypted tunnel token; it needs no CRDs, so no dependsOn.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/cloudflared
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# Resources built on the controllers' CRDs: the cert-manager ClusterIssuer (with its
# SOPS-encrypted Cloudflare token), and the shared Gateway with its wildcard Certificate.
# Nothing depends on it, so a slow or failing issuance can't block other Kustomizations;
# app HTTPRoutes only need the Gateway API CRDs from infra-controllers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: infra-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# Logging: Alloy ships pod logs, Kubernetes events and the k3s journal to Loki
# (30-day retention), with Grafana as the UI. Grafana's HTTPRoute needs the Gateway
# API CRDs (dependsOn); there are no secrets, so no decryption.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: infra-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/observability
  prune: true
  wait: true
