# Cluster-level infrastructure, reconciled from ./infrastructure/controllers.
# Add an `infra-configs` Kustomization (dependsOn: infra-controllers) later for
# resources that need the controllers' CRDs first, such as cert-manager ClusterIssuers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers
  prune: true
  wait: true
---
# GitHub Actions runner scale set. Separate from the controllers because it needs
# the ARC CRDs first (dependsOn) and carries a SOPS-encrypted GitHub token.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arc-runners
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: infra-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/arc-runners
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
