# Applied once with kubectl to bootstrap, then managed from Git (this file is
# inside the path it syncs, so Flux keeps it reconciled).
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "1h"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  distribution:
    # A semver range enables automatic updates: the operator checks every
    # `reconcileEvery` and upgrades Flux to the newest 2.x release.
    version: "2.x"
    registry: "ghcr.io/fluxcd"
    # Also picks up CVE patches and hotfixes between Flux releases.
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: "cluster.local"
  sync:
    kind: GitRepository
    # Public repo: no pullSecret needed for read access over HTTPS.
    url: "https://github.com/lixin9311/homeops.git"
    ref: "refs/heads/main"
    path: "clusters/mega"
  kustomize:
    patches:
      # SOPS: let the generated `flux-system` Kustomization decrypt secrets with
      # the age key stored in the `sops-age` Secret (created manually, once).
      - target:
          kind: Kustomization
          name: flux-system
        patch: |
          - op: add
            path: /spec/decryption
            value:
              provider: sops
              secretRef:
                name: sops-age
