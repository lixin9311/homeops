name: ARC runner image

# Builds ghcr.io/<owner>/arc-runner-solana, the pod image for the `mega` runner
# scale set (infrastructure/arc-runners/release.yaml). This repository is public,
# so the job runs on a GitHub-hosted runner and never on the self-hosted ones,
# and there is no pull_request trigger.
on:
  push:
    branches: [main]
    paths:
      - images/arc-runner-solana/**
      - .github/workflows/arc-runner-image.yml
  schedule:
    # Weekly, Sunday 03:00 JST: picks up updates to the floating base image.
    - cron: '0 18 * * 0'
  workflow_dispatch:

concurrency:
  group: arc-runner-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/arc-runner-solana

jobs:
  build:
    name: Build, smoke test, push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build once into the local Docker daemon and test it before anything is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/arc-runner-solana
          platforms: linux/amd64
          load: true
          tags: arc-runner-solana:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm \
            -v "$PWD/images/arc-runner-solana/smoke-test.sh:/smoke-test.sh:ro" \
            arc-runner-solana:smoke bash /smoke-test.sh

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,format=short

      # Same inputs and cache as the build above, so this reuses every layer.
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/arc-runner-solana
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
