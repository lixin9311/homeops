apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 1h
  url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    # Exact tag, bumped by Renovate PRs (renovate.json). It reads `tag`, not `semver`.
    tag: "0.29.1"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 1h
  releaseName: cnpg
  chartRef:
    kind: OCIRepository
    name: cnpg
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The chart's defaults install the CRDs (crds.create: true, annotated
  # helm.sh/resource-policy: keep, so Clusters survive an uninstall) and watch every namespace.
