# MetalLB's speaker uses host networking to answer ARP for the addresses it owns; the
# labels keep it allowed should Pod Security admission ever be enforced.
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
