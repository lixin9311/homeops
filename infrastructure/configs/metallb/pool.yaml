# LAN addresses MetalLB may give to LoadBalancer Services. Reserve them on the router
# so DHCP never hands them out.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan
  namespace: metallb-system
spec:
  addresses:
    - 10.10.1.98/32
  # Only Services that ask for one of these addresses get it (the Gateway pins
  # 10.10.1.98 in infrastructure/configs/gateway/envoyproxy.yaml).
  autoAssign: false
---
# Announces the pool with ARP. Only on the 10.10.1.0/24 NIC, not eno1 (10.10.0.0/24).
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan
  namespace: metallb-system
spec:
  ipAddressPools:
    - lan
  interfaces:
    - enp5s0f0np0
