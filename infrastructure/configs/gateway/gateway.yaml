# Envoy Gateway runs this Gateway's proxy in envoy-gateway-system behind a LoadBalancer
# Service, which MetalLB gives its own LAN address, 10.10.1.98 (envoyproxy.yaml). The
# node keeps 10.10.1.99, so its sshd and this Gateway can both use port 22.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: gateway
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: main
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lucas.icu"
      tls:
        mode: Terminate
        certificateRefs:
          - name: lucas-icu-tls
      allowedRoutes:
        namespaces:
          # Apps attach their HTTPRoutes from their own namespaces.
          from: All
    # Plain HTTP only redirects to HTTPS (https-redirect.yaml), so no app routes attach here.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lucas.icu"
      allowedRoutes:
        namespaces:
          from: Same
    # Raw TCP for git over SSH, reached by the git-ssh.lucas.icu tunnel route and directly
    # from the LAN. SSH carries no hostname, so this port serves a single TCPRoute backend.
    - name: git-ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
