apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana
  namespace: observability
spec:
  interval: 1h
  # The community chart; the grafana/helm-charts copy is deprecated.
  url: oci://ghcr.io/grafana-community/helm-charts/grafana
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    # Exact tag, bumped by Renovate PRs (renovate.json). It reads `tag`, not `semver`.
    tag: "14.0.1"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: observability
spec:
  interval: 1h
  releaseName: grafana
  chartRef:
    kind: OCIRepository
    name: grafana
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # No admin password here: on first install the chart generates one into the `grafana`
  # Secret (key admin-password) and keeps it on upgrades.
  values:
    # Keeps users, preferences and UI-made dashboards (SQLite) across restarts.
    persistence:
      enabled: true
      size: 5Gi
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            uid: loki
            access: proxy
            url: http://loki.observability.svc.cluster.local:3100
            isDefault: true
          # Both from kube-prometheus-stack.yaml.
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          - name: Alertmanager
            type: alertmanager
            uid: alertmanager
            access: proxy
            url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
            jsonData:
              implementation: prometheus
    # Loads dashboards from ConfigMaps labelled grafana_dashboard in this namespace, such
    # as the ones kube-prometheus-stack deploys.
    sidecar:
      dashboards:
        enabled: true
    # HTTPRoute on the shared Gateway; the chart also sets server.domain from the hostname.
    route:
      main:
        enabled: true
        hostnames:
          - grafana.lucas.icu
        parentRefs:
          - name: main
            namespace: gateway
            sectionName: https
    grafana.ini:
      server:
        # Grafana builds absolute links and redirects from this.
        root_url: https://grafana.lucas.icu
      analytics:
        reporting_enabled: false
