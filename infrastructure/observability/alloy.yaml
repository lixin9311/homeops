apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: observability
spec:
  interval: 1h
  # The Alloy chart is only published to this classic Helm repo, not as an OCI artifact.
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: observability
spec:
  interval: 1h
  releaseName: alloy
  chart:
    spec:
      chart: alloy
      # Exact version, bumped by Renovate PRs (renovate.json).
      version: "1.14.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # DaemonSet (the chart default): one collector per node, reading that node's files.
    alloy:
      enableReporting: false
      # Read positions live on the host, so a restarted pod doesn't re-send old lines.
      storagePath: /var/lib/alloy
      mounts:
        # Pod logs are under /var/log/pods, the systemd journal under /var/log/journal.
        varlog: true
        extra:
          - name: storage
            mountPath: /var/lib/alloy
      configMap:
        content: |
          // Container logs. kubelet writes them to /var/log/pods/<ns>_<pod>_<uid>/<container>/N.log.
          discovery.kubernetes "pods" {
            role = "pod"
            // Only this node's pods; the chart sets HOSTNAME to the node name.
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
            }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            // Loki names the service (what Logs Drilldown groups by) after `app`, else `container`.
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
          }

          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pods.receiver]
          }

          loki.process "pods" {
            // Strip containerd's prefix (timestamp, stream, partial-line flag) from each line.
            stage.cri {}
            // The file path holds the pod UID and restart count; as a label it would split
            // every container into many streams. namespace/pod/container already identify it.
            stage.label_drop {
              values = ["filename"]
            }
            forward_to = [loki.write.default.receiver]
          }

          // Kubernetes events (scheduling, image pulls, OOM kills), like GKE's event log.
          // Every collector ships all events: with a second node this would duplicate them.
          loki.source.kubernetes_events "events" {
            job_name   = "kubernetes-events"
            log_format = "logfmt"
            forward_to = [loki.write.default.receiver]
          }

          // k3s itself (API server, kubelet, containerd) logs to the systemd journal.
          loki.source.journal "k3s" {
            path       = "/var/log/journal"
            matches    = "_SYSTEMD_UNIT=k3s.service"
            labels     = {job = "k3s"}
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
    controller:
      volumes:
        extra:
          - name: storage
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate
